<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Панель управления</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dash-hero { padding: 48px 0; }
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Security</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="dashboard.html">Панель</a></li>
          <li class="nav-item"><a class="nav-link" href="scan_qr.html">Проверка QR</a></li>
          <li class="nav-item"><a class="nav-link" href="visitors.html">Посетители</a></li>
          <li class="nav-item"><a class="nav-link" href="statistics.html">Статистика</a></li>
          <li class="nav-item"><a class="nav-link" href="staff.html" id="staff-nav-link" style="display: none;">Охранники</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a class="btn btn-primary" href="login.html">Выход</a>
        </div>
      </div>
    </div>
  </nav>
  

  <main class="container dash-hero">
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center" style="width:56px;height:56px;">
            <i class="bi bi-grid-1x2" style="font-size:24px;"></i>
          </div>
        </div>
        <h1 class="h4 mb-2 text-center">Панель управления</h1>
        <p class="text-muted mb-4 text-center">Добро пожаловать! Здесь будет основной функционал портала.</p>
        <div class="d-flex justify-content-center gap-4 flex-wrap">
          <div class="text-center">
            <a class="btn btn-primary btn-tile" href="scan_qr.html" aria-label="Страница проверки QR-кода">
              <i class="bi bi-qr-code-scan"></i>
            </a>
            <div class="small text-muted mt-2">Проверка QR</div>
          </div>
          <div class="text-center">
            <a class="btn btn-primary btn-tile" href="visitors.html" aria-label="Страница с данными о посетителях">
              <i class="bi bi-person-lines-fill"></i>
            </a>
            <div class="small text-muted mt-2">Посетители</div>
          </div>
          <div class="text-center">
            <a class="btn btn-primary btn-tile" href="statistics.html" aria-label="Страница со статистикой посещения">
              <i class="bi bi-graph-up"></i>
            </a>
            <div class="small text-muted mt-2">Статистика</div>
          </div>
          <div class="text-center" id="staff-tile" style="display: none;">
            <a class="btn btn-primary btn-tile" href="staff.html" aria-label="Страница управления охранниками">
              <i class="bi bi-shield-check"></i>
            </a>
            <div class="small text-muted mt-2">Охранники</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/auth-utils.js"></script>
  <script>
    // Показываем ссылку на охранников для админа
    document.addEventListener('DOMContentLoaded', function() {
      if (window.authUtils && window.authUtils.isAdmin()) {
        const staffLink = document.getElementById('staff-nav-link');
        if (staffLink) staffLink.style.display = 'block';
        const staffTile = document.getElementById('staff-tile');
        if (staffTile) staffTile.style.display = 'block';
      }
    });
  </script>
</body>
</html>
