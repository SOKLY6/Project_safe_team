<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-bg">
  <div class="container min-vh-100 d-flex flex-column justify-content-center py-5">
    <div class="text-center mb-4">
      <h1 class="h3 mb-1">Добро пожаловать!</h1>
      <p class="text-muted mb-0">Войдите в аккаунт</p>
    </div>
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center" style="width:56px;height:56px;">
                <i class="bi bi-shield-lock" style="font-size:24px;"></i>
              </div>
            </div>
            
            <form id="login-form" action="/login" method="post" autocomplete="on" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Логин</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input id="username" name="username" type="text" class="form-control" required maxlength="64" autocomplete="username" autofocus>
                </div>
                <div class="invalid-feedback" id="username-error" aria-live="polite"></div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <div class="input-group password-wrapper">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input id="password" name="password" type="password" class="form-control" required maxlength="128" autocomplete="current-password">
                  <button type="button" class="btn btn-outline-secondary toggle-password" aria-label="Показать пароль" aria-pressed="false">
                    <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20">
                      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20">
                      <path d="M3 3l18 18" />
                      <path d="M10.58 10.58a3 3 0 004.24 4.24" />
                      <path d="M9.88 5.09A10.94 10.94 0 0112 5c7 0 11 7 11 7a17.74 17.74 0 01-3.21 3.87" />
                      <path d="M6.61 6.61A17.73 17.73 0 001 12s4 7 11 7a10.66 10.66 0 005.39-1.61" />
                    </svg>
                    <span class="sr-only">Показать пароль</span>
                  </button>
                </div>
                <div class="invalid-feedback" id="password-error" aria-live="polite"></div>
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg rounded-3">Войти</button>
              </div>
              <div class="form-status small text-muted mt-3" id="form-status" aria-live="polite"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
