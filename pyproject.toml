[project]
name = "Safe_Team"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.19.0",
    "fastapi==0.104.1",
    "httpx>=0.28.1",
    "pydantic==2.5.0",
    "python-decouple>=3.8",
    "requests==2.31.0",
    "sqlalchemy==2.0.23",
    "uvicorn==0.24.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.2",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 79
target-version = 'py312'

[tool.ruff.lint]
fixable = ['ALL']
select = ['E', 'F', 'I', 'B', 'Q']
ignore = ['E101', "B008"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.mypy]
python_version = '3.12'
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src/']
